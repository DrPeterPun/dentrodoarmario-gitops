name: Update image tag

on:
  workflow_dispatch:
    inputs:
      app:
        description: App directory under apps/
        required: true
        default: batalha-naval
      environment:
        description: Overlay to update
        required: true
        type: choice
        options:
          - production
          - staging
      image:
        description: Image name as used in kustomization (e.g. nginx)
        required: true
        default: itzg/minecraft-server
      tag:
        description: New image tag
        required: true
      newName:
        description: Optional replacement image name (registry/repo)
        required: false
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar -xzf kustomize.tgz kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "app=${{ github.event.client_payload.app }}" >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.event.client_payload.environment }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ github.event.client_payload.image }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
            echo "newName=${{ github.event.client_payload.newName }}" >> "$GITHUB_OUTPUT"
          else
            echo "app=${{ inputs.app }}" >> "$GITHUB_OUTPUT"
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "newName=${{ inputs.newName }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture image list
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGES_JSON: ${{ toJson(github.event.client_payload.images) }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -n "${IMAGES_JSON}" ] && [ "${IMAGES_JSON}" != "null" ]; then
            printf '%s' "$IMAGES_JSON" > /tmp/images.json
          else
            echo "null" > /tmp/images.json
          fi

      - name: Set image in overlay
        id: images
        working-directory: apps/${{ steps.inputs.outputs.app }}/overlays/${{ steps.inputs.outputs.environment }}
        run: |
          set_one() {
            local image="$1" tag="$2" new_name="$3"
            if [ -n "$new_name" ] && [ "$new_name" != "null" ]; then
              kustomize edit set image "${image}=${new_name}:${tag}"
            else
              kustomize edit set image "${image}=${image}:${tag}"
            fi
          }
          summary=""
          if [ "$(cat /tmp/images.json)" != "null" ]; then
            while IFS= read -r row; do
              image="$(printf '%s' "$row" | jq -r '.image')"
              tag="$(printf '%s' "$row" | jq -r '.tag')"
              new_name="$(printf '%s' "$row" | jq -r '.newName // empty')"
              set_one "$image" "$tag" "$new_name"
              summary="${summary}${image}:${tag} "
            done < <(jq -c '.[]' /tmp/images.json)
          else
            image='${{ steps.inputs.outputs.image }}'
            tag='${{ steps.inputs.outputs.tag }}'
            new_name='${{ steps.inputs.outputs.newName }}'
            set_one "$image" "$tag" "$new_name"
            summary="${image}:${tag}"
          fi
          kustomize build .
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/${{ steps.inputs.outputs.app }}/overlays/${{ steps.inputs.outputs.environment }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "deploy(${{ steps.inputs.outputs.app }}): ${{ steps.inputs.outputs.environment }} -> ${{ steps.images.outputs.summary }}"
          git push
