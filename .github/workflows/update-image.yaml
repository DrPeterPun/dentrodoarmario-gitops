name: Update image tag

on:
  workflow_dispatch:
    inputs:
      app:
        description: App directory under apps/
        required: true
        default: batalha-naval
      environment:
        description: Overlay to update
        required: true
        type: choice
        options:
          - production
          - staging
      image:
        description: Image name as used in kustomization (e.g. nginx)
        required: true
        default: itzg/minecraft-server
      tag:
        description: New image tag
        required: true
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -fsSL -o kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar -xzf kustomize.tgz kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "app=${{ github.event.client_payload.app }}" >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.event.client_payload.environment }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ github.event.client_payload.image }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "app=${{ inputs.app }}" >> "$GITHUB_OUTPUT"
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image in overlay
        working-directory: apps/${{ steps.inputs.outputs.app }}/overlays/${{ steps.inputs.outputs.environment }}
        run: |
          kustomize edit set image "${{ steps.inputs.outputs.image }}=${{ steps.inputs.outputs.image }}:${{ steps.inputs.outputs.tag }}"
          kustomize build .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/${{ steps.inputs.outputs.app }}/overlays/${{ steps.inputs.outputs.environment }}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "deploy(${{ steps.inputs.outputs.app }}): ${{ steps.inputs.outputs.environment }} -> ${{ steps.inputs.outputs.image }}:${{ steps.inputs.outputs.tag }}"
          git push
