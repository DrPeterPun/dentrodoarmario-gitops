name: Validate manifests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Build and validate overlays
        run: |
          set -euo pipefail
          shopt -s nullglob
          overlays=(apps/*/overlays/*)
          if [ ${#overlays[@]} -eq 0 ]; then
            echo "No app overlays found"
            exit 1
          fi
          for overlay in "${overlays[@]}"; do
            echo "::group::${overlay}"
            kubectl kustomize "${overlay}" | kubeconform -strict -ignore-missing-schemas -summary
            echo "::endgroup::"
          done
          kubectl kustomize clusters/in-cluster >/dev/null
