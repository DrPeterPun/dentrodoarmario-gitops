name: Publish meta-stats

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-meta-stats.yaml
  repository_dispatch:
    types: [publish-meta-stats]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: drpeterpun/meta-stats

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          path: gitops

      - name: Checkout meta-stats
        uses: actions/checkout@v4
        with:
          repository: MtgoMetaStats/meta-stats
          token: ${{ secrets.MTGO_REPO_TOKEN }}
          path: meta-stats

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: meta-stats
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/DrPeterPun/dentrodoarmario-gitops
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for method in POST PUT; do
            gh api --method "$method" \
              -H "Accept: application/vnd.github+json" \
              /user/packages/container/meta-stats/visibility \
              -f visibility=public && exit 0
          done
          exit 0

      - name: Bump overlay image
        working-directory: gitops
        run: |
          curl -fsSL -o kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar -xzf kustomize.tgz kustomize
          ./kustomize edit set image "local/meta-stats=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" \
            --directory apps/mtgo/overlays/production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mtgo/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image change"
            exit 0
          fi
          git commit -m "deploy(mtgo): production -> ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}"
          git push
