apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/DrPeterPun/dentrodoarmario-gitops.git
        revision: HEAD
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: "{{ index .path.segments 1 }}-{{ index .path.segments 3 }}"
    spec:
      project: dentrodoarmario
      source:
        repoURL: https://github.com/DrPeterPun/dentrodoarmario-gitops.git
        targetRevision: HEAD
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 1 }}-{{ index .path.segments 3 }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
