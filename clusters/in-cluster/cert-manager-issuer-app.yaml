apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuer
spec:
  project: default
  source:
    repoURL: https://github.com/DrPeterPun/dentrodoarmario-gitops.git
    targetRevision: HEAD
    path: clusters/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
