apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 9cfe7ca3555a54246415ec6a29b2f26b8d30b527
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: 0b7a7d6a4ebf7b191113fa0755d0f0f9954d57c2
- name: postgres
  newName: postgres
  newTag: "16"
