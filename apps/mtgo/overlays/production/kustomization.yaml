apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: a44f3473a79f8d9222388b8f5856ec20d1dc4376
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: fc3a2322a0894f25ea73d6b45f478022101fcda1
- name: postgres
  newName: postgres
  newTag: "16"
