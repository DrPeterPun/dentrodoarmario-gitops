      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 0240651e5852f1b2a5486e51f990ae0f885bb11b
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: 42810ffa982ea419083636a932449771f25950f3
- name: postgres
  newName: postgres
  newTag: "16"
