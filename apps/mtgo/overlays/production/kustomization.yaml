apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: e602a5a150d0de9353dae2a61997dc2f1a17b453
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: eb47869ac9032e814061f0baa9728d5505f70e81
- name: postgres
  newName: postgres
  newTag: "16"
