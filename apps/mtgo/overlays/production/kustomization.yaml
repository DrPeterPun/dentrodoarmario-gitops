apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # Private ghcr.io/mtgometastats/* packages cannot be pulled (private
  # source repos, no imagePullSecrets). Use images the node already has
  # or that are public.
  - name: postgres
    newName: postgres
    newTag: "16"
  - name: local/mtgosdk
    newName: videreproject/mtgosdk
    newTag: headless
  - name: local/meta-stats
    newName: local/meta-stats
    newTag: latest
