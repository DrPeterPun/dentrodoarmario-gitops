apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
images:
  - name: postgres
    newName: postgres
    newTag: "16"
  - name: local/mtgosdk
    newName: videreproject/mtgosdk
    newTag: headless
  - name: local/meta-stats
    newName: local/meta-stats
    newTag: latest
