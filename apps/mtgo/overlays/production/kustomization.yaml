apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: cabe2250b06d3912a463411f4313e311c262dc2a
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: 82186a2081c88043e540eb16153047e249430d0c
- name: postgres
  newName: postgres
  newTag: "16"
