apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 0b38b4ae88fdbe067c03591a1d6d23857d71e7bf
- name: local/mtgosdk
  newName: videreproject/mtgosdk
  newTag: headless
- name: postgres
  newName: postgres
  newTag: "16"
