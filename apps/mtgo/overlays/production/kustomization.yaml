apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: f7e3d65777d791eca9aee4ca969fdb2e3bffe7f8
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: b40d4b5505e517832a4fc3640f46e0fafdd3619b
- name: postgres
  newName: postgres
  newTag: "16"
