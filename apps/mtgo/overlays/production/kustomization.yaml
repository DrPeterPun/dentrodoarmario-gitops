apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 79025abecb2da7dbbf5f9abf0912108099d149c5
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: ca6d75dce9aef858a08a4c480c4f98766c341405
- name: postgres
  newName: postgres
  newTag: "16"
