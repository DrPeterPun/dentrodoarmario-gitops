apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: c5d83ea1951ed0576d87367bdaa9ea07a48880c9
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: 8ef08a631e293fcd1d3c0020ab795055b245f158
- name: postgres
  newName: postgres
  newTag: "16"
