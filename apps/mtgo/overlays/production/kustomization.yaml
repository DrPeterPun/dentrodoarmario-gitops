apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 7258cdd3cfcb468d976990cdae214697eb56edd1
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: fed1f841b5496985f9ec4e687f461f94452032f7
- name: postgres
  newName: postgres
  newTag: "16"
