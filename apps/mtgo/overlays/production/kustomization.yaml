apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull
  target:
    kind: Deployment
images:
- name: local/meta-stats
  newName: ghcr.io/mtgometastats/meta-stats
  newTag: 1ca649c68b2d8da5b5d99add35337fd386463fa9
- name: local/mtgosdk
  newName: ghcr.io/mtgometastats/mtgo-bot
  newTag: dbfeb12d655a5131851a72143d337edc4ff37760
- name: postgres
  newName: postgres
  newTag: "16"
