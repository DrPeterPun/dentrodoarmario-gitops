apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - db-pv.yaml
  - db-pvc.yaml
  - db-deployment.yaml
  - db-service.yaml
  - bot-pv.yaml
  - bot-pvc.yaml
  - wine-pv.yaml
  - wine-pvc.yaml
  - sdk-pv.yaml
  - sdk-pvc.yaml
  - bot-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml
  - scheduler-deployment.yaml
configMapGenerator:
  - name: mtgo-schema
    files:
      - schema.sql
    options:
      disableNameSuffixHash: true
  - name: mtgo-fetch-sdk
    files:
      - fetch-mtgosdk.py
    options:
      disableNameSuffixHash: true
images:
  - name: postgres
    newName: postgres
    newTag: "16"
  - name: local/mtgosdk
    newName: videreproject/mtgosdk
    newTag: headless
  - name: local/meta-stats
    newName: local/meta-stats
    newTag: latest
