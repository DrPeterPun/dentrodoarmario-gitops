apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtgo-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtgo-bot
  template:
    metadata:
      labels:
        app: mtgo-bot
      annotations:
        container.apparmor.security.beta.kubernetes.io/mtgobot: unconfined
    spec:
      nodeSelector:
        kubernetes.io/hostname: dentrodoarmario
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:16
          envFrom:
            - secretRef:
                name: mtgo-env
          command:
            - sh
            - -c
            - until PGHOST=db pg_isready -h db -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
        - name: fetch-mtgosdk
          image: python:3.12-alpine
          command: ["python", "/scripts/fetch-mtgosdk.py"]
          volumeMounts:
            - name: sdk
              mountPath: /MTGOSDK
            - name: fetch-script
              mountPath: /scripts
              readOnly: true
        - name: check-workspace
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "workspace contents:"
              ls -la /workspace || true
              ls -la /workspace/src || true
              if [ ! -f /workspace/src/MTGOBot.csproj ]; then
                echo "ERROR: /workspace/src/MTGOBot.csproj is missing. The bot hostPath must be a mtgo-bot checkout."
                exit 1
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: mtgobot
          image: local/mtgosdk:headless
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          workingDir: /workspace
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              export DISPLAY="${DISPLAY:-:99}"
              export WINEDEBUG="${WINEDEBUG:--all}"
              export DOTNET_ROOT='C:\dotnet'
              export PATH="/opt/wine/bin:${PATH}"
              rm -f /tmp/.X${DISPLAY#:}-lock /tmp/.X11-unix/X${DISPLAY#:} || true
              echo "Starting Xvfb on $DISPLAY"
              Xvfb "$DISPLAY" -screen 0 "${RESOLUTION:-1280x1024x24}" &
              XVFB_PID=$!
              trap 'kill $XVFB_PID' EXIT
              for i in $(seq 1 50); do
                if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
                  echo "Xvfb is ready."
                  break
                fi
                sleep 0.1
              done
              echo "Running wine-run src/MTGOBot.csproj"
              wine-run src/MTGOBot.csproj
          envFrom:
            - secretRef:
                name: mtgo-env
          env:
            - name: MTGOSDK_PATH
              value: /MTGOSDK
            - name: DISPLAY
              value: ":99"
            - name: WINEDEBUG
              value: "-all"
            - name: ALSA_LOG_LEVEL
              value: "0"
            - name: TZ
              value: Europe/Lisbon
            - name: PGHOST
              value: db
            - name: MTGO_HEADLESS
              value: "true"
            - name: RESOLUTION
              value: 1280x1024x24
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: sdk
              mountPath: /MTGOSDK
            - name: dotenv
              mountPath: /workspace/src/.env
              subPath: dotenv
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mtgo-bot-pvc
        - name: sdk
          persistentVolumeClaim:
            claimName: mtgo-sdk-pvc
        - name: dotenv
          secret:
            secretName: mtgo-dotenv
            items:
              - key: dotenv
                path: dotenv
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: fetch-script
          configMap:
            name: mtgo-fetch-sdk
            defaultMode: 0755
