apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtgo-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtgo-bot
  template:
    metadata:
      labels:
        app: mtgo-bot
      annotations:
        container.apparmor.security.beta.kubernetes.io/mtgobot: unconfined
    spec:
      nodeSelector:
        kubernetes.io/hostname: dentrodoarmario
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:16
          envFrom:
            - secretRef:
                name: mtgo-env
          command:
            - sh
            - -c
            - until PGHOST=db pg_isready -h db -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
        - name: seed-wine
          image: local/mtgosdk:headless
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              if [ ! -d /persist/drive_c ]; then
                echo "Seeding Wine prefix from image"
                cp -a /home/wine/.wine/. /persist/
              fi
              if [ ! -e /persist/drive_c/dotnet/dotnet.exe ]; then
                echo "Copying Windows .NET SDK into the Wine prefix"
                mkdir -p /persist/drive_c
                cp -a /home/wine/.wine/drive_c/dotnet /persist/drive_c/
              fi
          volumeMounts:
            - name: wine
              mountPath: /persist
        - name: fetch-mtgosdk
          image: python:3.12-alpine
          command: ["python", "/scripts/fetch-mtgosdk.py"]
          volumeMounts:
            - name: sdk
              mountPath: /MTGOSDK
            - name: fetch-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: mtgobot
          image: local/mtgosdk:headless
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          workingDir: /workspace
          command: ["/usr/local/bin/xvfb-entrypoint.sh"]
          args: ["wine-run", "src/MTGOBot.csproj"]
          envFrom:
            - secretRef:
                name: mtgo-env
          env:
            - name: MTGOSDK_PATH
              value: /MTGOSDK
            - name: DISPLAY
              value: ":99"
            - name: WINEDEBUG
              value: "-all"
            - name: ALSA_LOG_LEVEL
              value: "0"
            - name: TZ
              value: Europe/Lisbon
            - name: PGHOST
              value: db
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: sdk
              mountPath: /MTGOSDK
            - name: wine
              mountPath: /home/wine/.wine
            - name: dotenv
              mountPath: /workspace/src/.env
              subPath: dotenv
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            privileged: true
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "3Gi"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mtgo-bot-pvc
        - name: sdk
          persistentVolumeClaim:
            claimName: mtgo-sdk-pvc
        - name: wine
          persistentVolumeClaim:
            claimName: mtgo-wine-pvc
        - name: dotenv
          secret:
            secretName: mtgo-dotenv
            items:
              - key: dotenv
                path: dotenv
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: fetch-script
          configMap:
            name: mtgo-fetch-sdk
            defaultMode: 0755
