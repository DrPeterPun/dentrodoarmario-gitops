apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtgo-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtgo-db
  template:
    metadata:
      labels:
        app: mtgo-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: dentrodoarmario
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: mtgo-env
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: mtgo-env
                  key: PGDATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mtgo-env
                  key: PGUSER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mtgo-env
                  key: PGPASSWORD
            - name: TZ
              value: Europe/Lisbon
            - name: PGHOST
              value: localhost
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h localhost -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mtgo-postgres-pvc
        - name: schema
          configMap:
            name: mtgo-schema
