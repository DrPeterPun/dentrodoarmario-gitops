apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtgo-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mtgo-scheduler
  template:
    metadata:
      labels:
        app: mtgo-scheduler
    spec:
      nodeSelector:
        kubernetes.io/hostname: dentrodoarmario
      initContainers:
        - name: wait-for-db
          image: postgres:16
          envFrom:
            - secretRef:
                name: mtgo-env
          command:
            - sh
            - -c
            - until PGHOST=db pg_isready -h db -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done
      containers:
        - name: scheduler
          image: local/meta-stats:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "-m", "app.scheduler.main"]
          envFrom:
            - secretRef:
                name: mtgo-env
          env:
            - name: SCHEDULER_TIMEZONE
              value: UTC
            - name: PGHOST
              value: db
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mtgo-env
                  key: DATABASE_URL
            - name: CARD_IMAGE_DIR
              value: /data/card-images
          volumeMounts:
            - name: card-images
              mountPath: /data/card-images
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
      volumes:
        - name: card-images
          persistentVolumeClaim:
            claimName: mtgo-card-images-pvc
