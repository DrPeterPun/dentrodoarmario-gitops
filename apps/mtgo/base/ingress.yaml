apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtgo-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: mtgo-production-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcppereira.ddns.net
      secretName: mtgo-web-tls
  rules:
    - host: mcppereira.ddns.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtgo-web
                port:
                  number: 8000
