apiVersion: v1
kind: ConfigMap
metadata:
  name: wireguard-custom-init
data:
  10-listen-port.sh: |
    #!/bin/bash
    # linuxserver always writes ListenPort = 51820; SERVERPORT is only the
    # advertised WAN port. Align the in-pod listen port with SERVERPORT so
    # router 41820 -> 192.168.1.101:41820 reaches wg0.
    set -euo pipefail
    PORT="${SERVERPORT:-41820}"
    echo "[custom-init] setting ListenPort to ${PORT}"
    for f in /config/templates/server.conf /config/wg_confs/wg0.conf; do
      if [[ -f "${f}" ]]; then
        sed -i "s/^ListenPort = .*/ListenPort = ${PORT}/" "${f}"
      fi
    done
