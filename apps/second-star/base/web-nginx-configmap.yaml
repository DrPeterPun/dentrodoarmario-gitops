apiVersion: v1
kind: ConfigMap
metadata:
  name: second-star-web-nginx
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;

      # Page routes and API routes share names (/users, /events, /quotes, …).
      # Traefik sends the whole host here; this prefix is stripped before Merlin.
      location /api/ {
        proxy_pass http://second-star-api:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
