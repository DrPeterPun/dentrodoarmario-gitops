apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: second-star
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: second-star-production-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - secondstart.pt
      secretName: secondstart-tls
  rules:
    - host: secondstart.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: second-star-web
                port:
                  number: 8088
