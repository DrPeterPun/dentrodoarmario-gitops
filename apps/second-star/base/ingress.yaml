apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: second-star
spec:
  ingressClassName: traefik
  rules:
    - host: secondstar.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: second-star-web
                port:
                  number: 8088
