apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - db-pv.yaml
  - db-pvc.yaml
  - db-deployment.yaml
  - db-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
images:
  - name: postgres
    newName: postgres
    newTag: "16"
  - name: local/second-star-merlin
    newName: local/second-star-merlin
    newTag: latest
  - name: local/second-star-encanto
    newName: local/second-star-encanto
    newTag: latest
